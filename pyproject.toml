[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "npc-planner"
version = "0.1.0a1"
description = "NPC Team Planner for Pokémon GBA ROM Hacks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
fetch = [
    "httpx>=0.24.0",
]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0.0",
    "types-pyyaml>=6.0.0",
]

[project.scripts]
npc-planner = "npc_planner.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/npc_planner"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "scripts"]
