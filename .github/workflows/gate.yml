name: gate

on:
  push:
    branches: [main, "milestone/**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pre-commit
      - name: Install hooks
        run: make hooks
      - name: Fetch integration branch ref
        run: git fetch origin '+refs/heads/milestone/*:refs/heads/milestone/*' || true
      - name: Gate
        run: make gate
      - name: Acceptance suites
        run: |
          for s in scripts/accept/M1-T*.sh; do
            echo "=== $s ==="
            bash "$s"
          done
      - name: Commit audit
        run: python3 scripts/audit_commits.py --range milestone/M1
