name: gate

on:
  push:
    branches: ["milestone/**"]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pre-commit
      - name: Install hooks
        run: make hooks
      - name: Fetch integration branch ref
        run: |
          git fetch origin '+refs/heads/milestone/*:refs/heads/milestone/*' || true
          git fetch origin main:main || true
          git fetch origin --tags --force || true
      - name: Gate
        run: make gate
      - name: Acceptance suites
        run: |
          for s in scripts/accept/M1-T10b.sh scripts/accept/M1-T11.sh scripts/accept/M1-T11b.sh scripts/accept/M1-T11c.sh scripts/accept/M1-T12.sh scripts/accept/M1-T12b.sh scripts/accept/M1-T12d.sh scripts/accept/M1-T12e.sh scripts/accept/M1-T12f.sh scripts/accept/M1-T12g.sh; do
            echo "=== RUNNING $s ==="
            bash "$s"; rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "!!! FAILED: $s rc=$rc !!!"
              exit "$rc"
            fi
          done
      - name: Commit audit
        run: python3 scripts/audit_commits.py --range d5dbc28..HEAD --first-parent
